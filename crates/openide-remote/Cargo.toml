[package]
name = "openide-remote"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
openide-core = { path = "../openide-core" }
openide-harness = { path = "../openide-harness" }
openide-connections = { path = "../openide-connections" }
axum = { version = "0.8", features = ["http2"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
base64 = "0.22"
url = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "http2"] }
jsonwebtoken = "9.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio-util = "0.7"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

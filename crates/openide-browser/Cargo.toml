[package]
name = "openide-browser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Chrome DevTools protocol driver for the browser shared by the user and the agent"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

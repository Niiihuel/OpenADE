<!doctype html><html lang="es"><head><title>Controles propios</title><style>
  body{font:16px sans-serif;margin:16px}.card{cursor:pointer;border:1px solid #333;padding:8px;margin:4px;width:200px}
  .tab{display:inline-block;padding:4px 8px;cursor:pointer}.ghost{pointer-events:none;opacity:.5}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .switch{display:inline-block;width:36px;height:18px;background:#999;border-radius:9px;vertical-align:middle}
  input:checked + .switch{background:#283}.hide{display:none}.box{display:inline-block;width:16px;height:16px;border:1px solid #333;vertical-align:middle}
  input:checked + .box{background:#333}.zero{opacity:0;position:absolute;width:20px;height:20px;margin:0}
  </style></head><body><h1>Controles propios</h1>
  <div class="card" onclick="out.textContent='Tarjeta uno'">Tarjeta uno</div>
  <div class="card" onclick="out.textContent='Tarjeta dos'"><h3>Tarjeta dos</h3><p>Con descripción</p><span class="more">Ver más</span></div>
  <div class="card ghost">Tarjeta inerte</div>
  <span onclick="out.textContent='Texto con clic'">Texto con clic sin cursor</span>
  <div role="button" tabindex="0" onclick="out.textContent='Rol botón'">Rol botón</div>
  <div role="tablist" aria-label="Secciones"><span class="tab" role="tab" aria-selected="true" tabindex="0">General</span><span class="tab" role="tab" aria-selected="false" tabindex="-1">Avanzado</span></div>
  <div role="tabpanel" aria-label="General"><p>Panel general</p></div>
  <div role="checkbox" aria-checked="mixed" tabindex="0">Tres estados</div>
  <div role="switch" aria-checked="true" tabindex="0">Modo oscuro</div>
  <div role="slider" aria-valuenow="30" aria-valuemin="0" aria-valuemax="100" aria-label="Brillo" tabindex="0"></div>
  <div role="progressbar" aria-valuenow="70" aria-label="Carga"></div>
  <label id="l1"><input type="checkbox" class="sr" id="c1" onchange="out.textContent='Avisos '+this.checked"><span class="switch"></span> Avisos</label>
  <input type="checkbox" class="hide" id="c2" onchange="out.textContent='Oculto '+this.checked"><label for="c2" id="l2"><span class="box"></span> Entrada oculta</label>
  <label id="l3"><input type="checkbox" class="zero" id="c3" onchange="out.textContent='Cero '+this.checked"><span class="box"></span> Opacidad cero</label>
  <div contenteditable="true" aria-label="Editor">Texto <b>editable</b></div>
  <div aria-hidden="true">Oculto para lectores <button>Botón aria-hidden</button></div>
  <div style="visibility:hidden"><button>Invisible</button></div>
  <div><div><div><button>Muy anidado</button></div></div></div>
  <svg width="20" height="20" role="img" aria-label="Icono"><circle cx="10" cy="10" r="8"/></svg>
  <svg width="20" height="20" onclick="out.textContent='svg'" style="cursor:pointer"><circle cx="10" cy="10" r="8"/></svg>
  <p id="out">Sin cambios</p></body></html>

[package]
name = "openide-acp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Client of the Agent Client Protocol: runs an external agent and talks to it over stdio"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

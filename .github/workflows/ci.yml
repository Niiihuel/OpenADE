name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # A debug build with CEF and whisper.cpp does not fit in the runner's free space.
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      # The version in Cargo.toml's rust-version.
      - uses: dtolnay/rust-toolchain@1.95.0
      # shell.nix brings the C toolchain, Wayland, ALSA and the CEF the browser links.
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: Swatinem/rust-cache@v2
      - run: nix-shell --run "cargo build --workspace --all-targets"
      # These four fail since before the move to limn (docs/ui-separation/baseline/red-list.txt).
      - run: >-
          nix-shell --run "cargo test --workspace --
          --skip app::native_anthropic_app_tests::messages_components_present_real_factory_journal_and_save_exact_policy_at_both_widths
          --skip app::native_effort_discovery_app_tests::native_codex_async_discovery_restores_saved_max_and_renders_effort_and_advanced_controls
          --skip code_line_alignment_visual_tests::native_code_rows_center_text_and_keep_selection_geometry_after_scroll
          --skip view::dock_visual_tests::workspace_sidebars_finish_all_corners_with_their_existing_radius"

<text x="180" y="198.85715" font-family="DejaVu Sans,sans-serif" font-size="12" dominant-baseline="text-before-edge" fill="#d4d4d4" fill-opacity="1" xml:space="preserve">Ofrecer herramientas de OpenIDE</text>
<text x="180" y="218.28572" font-family="DejaVu Sans,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">Claude Code, Codex y otras CLIs iniciadas desde OpenIDE reciben las herramientas activadas abajo. Desactivado, ninguna llamada externa llega </text>
<text x="180" y="232.42857" font-family="DejaVu Sans,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">a OpenIDE.</text>
<rect x="1084" y="212.7143" width="36" height="20" rx="10" fill="#4c4c4c" fill-opacity="1"/>
<rect x="1087" y="215.7143" width="14" height="14" rx="7" fill="#ebebeb" fill-opacity="1"/>
<rect x="170" y="256.57144" width="960" height="1" rx="0" fill="#2e2e2e" fill-opacity="1"/>
<svg opacity="1" y="268" x="180" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#a0a0a0" class="bi bi-terminal" viewBox="0 0 16 16">
  <path d="M6 9a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 0 1h-3A.5.5 0 0 1 6 9M3.854 4.146a.5.5 0 1 0-.708.708L4.793 6.5 3.146 8.146a.5.5 0 1 0 .708.708l2-2a.5.5 0 0 0 0-.708z"/>

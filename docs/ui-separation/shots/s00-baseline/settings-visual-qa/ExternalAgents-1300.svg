<text x="180" y="398.4286" font-family="DejaVu Sans,sans-serif" font-size="12" dominant-baseline="text-before-edge" fill="#d4d4d4" fill-opacity="1" xml:space="preserve">Revisión de cambios</text>
<text x="180" y="417.85715" font-family="DejaVu Sans,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">Lee los cambios sin confirmar del proyecto como los muestra la revisión. Solo lectura; no pide aprobación.</text>
<rect x="1084" y="405.2143" width="36" height="20" rx="10" fill="#ebebeb" fill-opacity="1"/>
<rect x="1103" y="408.2143" width="14" height="14" rx="7" fill="#373737" fill-opacity="1"/>
<rect x="170" y="442" width="960" height="1" rx="0" fill="#2e2e2e" fill-opacity="1"/>
<text x="180" y="453" font-family="DejaVu Sans,sans-serif" font-size="12" dominant-baseline="text-before-edge" fill="#d4d4d4" fill-opacity="1" xml:space="preserve">Navegador</text>
<text x="180" y="472.42856" font-family="DejaVu Sans,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">Todavía no disponible. Controlará el navegador integrado que ves en el panel lateral.</text>
<rect x="1084" y="459.7857" width="36" height="20" rx="10" fill="#ebebeb" fill-opacity="1"/>
<rect x="1103" y="462.7857" width="14" height="14" rx="7" fill="#373737" fill-opacity="1"/>
<rect x="170" y="496.57144" width="960" height="1" rx="0" fill="#2e2e2e" fill-opacity="1"/>
<text x="180" y="507.57144" font-family="DejaVu Sans,sans-serif" font-size="12" dominant-baseline="text-before-edge" fill="#d4d4d4" fill-opacity="1" xml:space="preserve">Otras conversaciones</text>
<text x="180" y="527" font-family="DejaVu Sans,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">Lee conversaciones de este proyecto, nunca de otros. Su contenido puede incluir datos sensibles o instrucciones que la CLI tome como propias.</text>
<rect x="1084" y="514.3572" width="36" height="20" rx="10" fill="#4c4c4c" fill-opacity="1"/>
<rect x="1087" y="517.3572" width="14" height="14" rx="7" fill="#ebebeb" fill-opacity="1"/>
<rect x="170" y="551.1429" width="960" height="1" rx="0" fill="#2e2e2e" fill-opacity="1"/>
<text x="180" y="562.1429" font-family="DejaVu Sans,sans-serif" font-size="12" dominant-baseline="text-before-edge" fill="#d4d4d4" fill-opacity="1" xml:space="preserve">Subagentes</text>
<text x="180" y="581.5715" font-family="DejaVu Sans,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">Todavía no disponible. Creará subagentes de OpenIDE y esperará su resultado.</text>
<rect x="1084" y="568.9286" width="36" height="20" rx="10" fill="#4c4c4c" fill-opacity="1"/>
<rect x="1087" y="571.9286" width="14" height="14" rx="7" fill="#ebebeb" fill-opacity="1"/>
</g>
<text x="174" y="621.7143" font-family="DejaVu Sans,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">Permisos</text>
<rect x="170" y="643.8572" width="960" height="136.42857" rx="8" fill="#2b2b2b" fill-opacity="1"/>
<rect x="170.5" y="644.3572" width="959" height="135.42857" rx="7.5" fill="none" stroke="#2e2e2e" stroke-opacity="1" stroke-width="1"/>

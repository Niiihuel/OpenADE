</svg>
<text x="206" y="267.57144" font-family="DejaVu Sans,sans-serif" font-size="12" dominant-baseline="text-before-edge" fill="#d4d4d4" fill-opacity="1" xml:space="preserve">Solo CLIs iniciadas por OpenIDE</text>
<text x="206" y="288" font-family="DejaVu Sans,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">Cada sesión recibe un acceso propio que deja de valer al cerrarla. Una CLI abierta por fuera de OpenIDE no puede conectarse.</text>
</g>
<text x="174" y="328.14288" font-family="DejaVu Sans,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">CLIs detectadas</text>
<text x="174" y="366.28574" font-family="DejaVu Sans,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">Herramientas ofrecidas</text>
<rect x="170" y="388.4286" width="960" height="217.2857" rx="8" fill="#2b2b2b" fill-opacity="1"/>
<rect x="170.5" y="388.9286" width="959" height="216.2857" rx="7.5" fill="none" stroke="#2e2e2e" stroke-opacity="1" stroke-width="1"/>

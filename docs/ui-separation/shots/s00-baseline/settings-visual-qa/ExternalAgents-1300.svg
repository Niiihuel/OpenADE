<text x="214" y="85.28571" font-family="DejaVu Sans,sans-serif" font-size="14" dominant-baseline="text-before-edge" fill="#d4d4d4" fill-opacity="1" xml:space="preserve">Información</text>
<text x="214" y="105.28571" font-family="DejaVu Sans,sans-serif" font-size="13" dominant-baseline="text-before-edge" fill="#888888" fill-opacity="1" xml:space="preserve">Funciona con Claude Code y Codex iniciados desde el menú de perfiles de la terminal. Navegador y subagentes todavía no </text>
<text x="214" y="122" font-family="DejaVu Sans,sans-serif" font-size="13" dominant-baseline="text-before-edge" fill="#888888" fill-opacity="1" xml:space="preserve">se ofrecen: sus interruptores se guardan para cuando estén disponibles.</text>
</g>
<text x="174" y="166.7143" font-family="DejaVu Sans,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">Puente de herramientas</text>
<rect x="170" y="188.85715" width="960" height="123.28571" rx="8" fill="#2b2b2b" fill-opacity="1"/>
<rect x="170.5" y="189.35715" width="959" height="122.28571" rx="7.5" fill="none" stroke="#2e2e2e" stroke-opacity="1" stroke-width="1"/>

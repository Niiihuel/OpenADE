<rect x="170" y="711.5715" width="960" height="1" rx="0" fill="#2e2e2e" fill-opacity="1"/>
<text x="180" y="722.5715" font-family="DejaVu Sans,sans-serif" font-size="12" dominant-baseline="text-before-edge" fill="#d4d4d4" fill-opacity="1" xml:space="preserve">Reglas de ejecución</text>
<text x="180" y="742.00006" font-family="DejaVu Sans,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">Las herramientas ofrecidas hoy solo leen. Cuando alguna ejecute comandos, las reglas que los deniegan valdrán también para las </text>
<text x="180" y="756.14294" font-family="DejaVu Sans,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">llamadas externas.</text>
<rect x="1017.4286" y="732.4286" width="102.57143" height="28" rx="4" fill="#373737" fill-opacity="1"/>
<rect x="1017.9286" y="732.9286" width="101.57143" height="27" rx="3.5" fill="none" stroke="#4e4e4e" stroke-opacity="1" stroke-width="1"/>

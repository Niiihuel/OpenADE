</svg>
<text x="56" y="328.42856" font-family="DejaVu Sans,sans-serif" font-size="12" dominant-baseline="text-before-edge" fill="#d4d4d4" fill-opacity="1" xml:space="preserve">Solo CLIs iniciadas por OpenIDE</text>
<text x="56" y="348.85712" font-family="DejaVu Sans,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">Cada sesión recibe un acceso propio que deja de valer al cerrarla. Una CLI </text>
<text x="56" y="362.99997" font-family="DejaVu Sans,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">abierta por fuera de OpenIDE no puede conectarse.</text>
</g>
<text x="24" y="403.14282" font-family="DejaVu Sans,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">CLIs detectadas</text>
<text x="24" y="441.28568" font-family="DejaVu Sans,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">Herramientas ofrecidas</text>
<rect x="20" y="463.42853" width="566" height="259.7143" rx="8" fill="#2b2b2b" fill-opacity="1"/>
<rect x="20.5" y="463.92853" width="565" height="258.7143" rx="7.5" fill="none" stroke="#2e2e2e" stroke-opacity="1" stroke-width="1"/>

<text x="30" y="473.42853" font-family="DejaVu Sans,sans-serif" font-size="12" dominant-baseline="text-before-edge" fill="#d4d4d4" fill-opacity="1" xml:space="preserve">Revisión de cambios</text>
<text x="30" y="492.8571" font-family="DejaVu Sans,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">Lee los cambios sin confirmar del proyecto como los muestra la revisión. Solo </text>
<text x="30" y="506.99994" font-family="DejaVu Sans,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">lectura; no pide aprobación.</text>
<rect x="540" y="487.28568" width="36" height="20" rx="10" fill="#ebebeb" fill-opacity="1"/>
<rect x="559" y="490.28568" width="14" height="14" rx="7" fill="#373737" fill-opacity="1"/>
<rect x="20" y="531.1428" width="566" height="1" rx="0" fill="#2e2e2e" fill-opacity="1"/>
<text x="30" y="542.1428" font-family="DejaVu Sans,sans-serif" font-size="12" dominant-baseline="text-before-edge" fill="#d4d4d4" fill-opacity="1" xml:space="preserve">Navegador</text>
<text x="30" y="561.5714" font-family="DejaVu Sans,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">Todavía no disponible. Controlará el navegador integrado que ves en el panel </text>
<text x="30" y="575.7143" font-family="DejaVu Sans,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">lateral.</text>
<rect x="540" y="555.99994" width="36" height="20" rx="10" fill="#ebebeb" fill-opacity="1"/>
<rect x="559" y="558.99994" width="14" height="14" rx="7" fill="#373737" fill-opacity="1"/>
<rect x="20" y="599.8571" width="566" height="1" rx="0" fill="#2e2e2e" fill-opacity="1"/>
<text x="30" y="610.8571" font-family="DejaVu Sans,sans-serif" font-size="12" dominant-baseline="text-before-edge" fill="#d4d4d4" fill-opacity="1" xml:space="preserve">Otras conversaciones</text>
<text x="30" y="630.2857" font-family="DejaVu Sans,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">Lee conversaciones de este proyecto, nunca de otros. Su contenido puede </text>
<text x="30" y="644.4286" font-family="DejaVu Sans,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">incluir datos sensibles o instrucciones que la CLI tome como propias.</text>
<rect x="540" y="624.71423" width="36" height="20" rx="10" fill="#4c4c4c" fill-opacity="1"/>
<rect x="543" y="627.71423" width="14" height="14" rx="7" fill="#ebebeb" fill-opacity="1"/>
<rect x="20" y="668.5714" width="566" height="1" rx="0" fill="#2e2e2e" fill-opacity="1"/>
<text x="30" y="679.5714" font-family="DejaVu Sans,sans-serif" font-size="12" dominant-baseline="text-before-edge" fill="#d4d4d4" fill-opacity="1" xml:space="preserve">Subagentes</text>
<text x="30" y="699" font-family="DejaVu Sans,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">Todavía no disponible. Creará subagentes de OpenIDE y esperará su resultado.</text>
<rect x="540" y="686.3571" width="36" height="20" rx="10" fill="#4c4c4c" fill-opacity="1"/>
<rect x="543" y="689.3571" width="14" height="14" rx="7" fill="#ebebeb" fill-opacity="1"/>
</g>

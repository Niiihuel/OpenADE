<rect x="20" y="865" width="566" height="1" rx="0" fill="#2e2e2e" fill-opacity="1"/>
<text x="30" y="876" font-family="DejaVu Sans,sans-serif" font-size="12" dominant-baseline="text-before-edge" fill="#d4d4d4" fill-opacity="1" xml:space="preserve">Reglas de ejecución</text>
<text x="30" y="895.4286" font-family="DejaVu Sans,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">Las herramientas ofrecidas hoy solo leen. Cuando alguna ejecute comandos, las reglas </text>
<text x="30" y="909.5715" font-family="DejaVu Sans,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">que los deniegan valdrán también para las llamadas externas.</text>
</g>

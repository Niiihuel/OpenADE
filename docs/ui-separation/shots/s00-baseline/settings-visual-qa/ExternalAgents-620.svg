<text x="64" y="135.2857" font-family="DejaVu Sans,sans-serif" font-size="13" dominant-baseline="text-before-edge" fill="#888888" fill-opacity="1" xml:space="preserve">Funciona con Claude Code y Codex iniciados desde el menú de </text>
<text x="64" y="151.99998" font-family="DejaVu Sans,sans-serif" font-size="13" dominant-baseline="text-before-edge" fill="#888888" fill-opacity="1" xml:space="preserve">perfiles de la terminal. Navegador y subagentes todavía no se </text>
<text x="64" y="168.71428" font-family="DejaVu Sans,sans-serif" font-size="13" dominant-baseline="text-before-edge" fill="#888888" fill-opacity="1" xml:space="preserve">ofrecen: sus interruptores se guardan para cuando estén disponibles.</text>
</g>
<text x="24" y="213.42856" font-family="DejaVu Sans,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">Puente de herramientas</text>

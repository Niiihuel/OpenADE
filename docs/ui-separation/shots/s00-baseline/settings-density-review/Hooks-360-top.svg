<text x="55" y="368.55362" font-family="Ubuntu,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">permisos de tu cuenta en las llamadas del agente </text>
<text x="55" y="381.22327" font-family="Ubuntu,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">nativo. Si el comando cambia en su archivo de origen, </text>
<text x="55" y="393.89288" font-family="Ubuntu,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">la entrada se desactiva sola.</text>

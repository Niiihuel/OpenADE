<text x="22" y="295.0625" font-family="Ubuntu,sans-serif" font-size="12" dominant-baseline="text-before-edge" fill="#d4d4d4" fill-opacity="1" xml:space="preserve">Ofrecer herramientas de OpenIDE</text>
<text x="22" y="312.88394" font-family="Ubuntu,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">Claude Code, Codex y otras CLIs iniciadas desde </text>
<text x="22" y="325.5536" font-family="Ubuntu,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">OpenIDE reciben las herramientas activadas </text>
<text x="22" y="338.22324" font-family="Ubuntu,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">abajo. Desactivado, ninguna llamada externa </text>
<text x="22" y="350.89288" font-family="Ubuntu,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">llega a OpenIDE.</text>

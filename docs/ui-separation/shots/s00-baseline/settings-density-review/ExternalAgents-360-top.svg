<rect x="307" y="626.1429" width="14" height="14" rx="7" fill="#373737" fill-opacity="1"/>
<rect x="12" y="664.72314" width="322" height="1" rx="0" fill="#2e2e2e" fill-opacity="1"/>
<text x="22" y="675.72314" font-family="Ubuntu,sans-serif" font-size="12" dominant-baseline="text-before-edge" fill="#d4d4d4" fill-opacity="1" xml:space="preserve">Otras conversaciones</text>
<text x="22" y="693.54456" font-family="Ubuntu,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">Lee conversaciones de este proyecto, nunca de </text>
<text x="22" y="706.2142" font-family="Ubuntu,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">otros. Su contenido puede incluir datos sensibles </text>
<text x="22" y="718.88385" font-family="Ubuntu,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">o instrucciones que la CLI tome como propias.</text>

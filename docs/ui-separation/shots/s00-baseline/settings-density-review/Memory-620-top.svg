<text x="56" y="645.6696" font-family="Ubuntu,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">Los nuevos turnos nativos leen AGENTS.md o AGENTS.override.md y las skills activas del proyecto. </text>
<text x="56" y="658.33923" font-family="Ubuntu,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">Antes de consultar al modelo, se guarda una copia exacta de esas instrucciones adicionales; el motor </text>
<text x="56" y="671.0089" font-family="Ubuntu,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">compone también sus propias instrucciones de modo y herramientas.</text>

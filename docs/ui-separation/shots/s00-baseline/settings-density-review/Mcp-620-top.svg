<text x="63" y="338.54468" font-family="Ubuntu,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">Inspeccionar conecta el servidor guardado, consulta sus herramientas y cierra la conexión. El listado </text>

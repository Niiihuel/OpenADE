<text x="63" y="473.04468" font-family="Ubuntu,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">Activar un servidor lo incluye en los próximos turnos del agente nativo en modo Build. La conexión, el </text>

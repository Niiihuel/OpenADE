<text x="48" y="798.03564" font-family="Ubuntu,sans-serif" font-size="12" dominant-baseline="text-before-edge" fill="#d4d4d4" fill-opacity="1" xml:space="preserve">Continuar un turno</text>
<text x="48" y="816.85706" font-family="Ubuntu,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">Los turnos con una copia guardada usan esas </text>
<text x="48" y="829.5267" font-family="Ubuntu,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">instrucciones al reanudarse. Cambiar instrucciones o </text>
<text x="48" y="842.19635" font-family="Ubuntu,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">skills afecta los turnos nuevos; no reemplaza las </text>
<text x="48" y="854.86597" font-family="Ubuntu,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">instrucciones guardadas de un turno interrumpido.</text>

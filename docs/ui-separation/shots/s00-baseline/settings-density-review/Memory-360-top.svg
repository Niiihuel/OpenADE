<text x="22" y="587.18744" font-family="Ubuntu,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">Revisa las instrucciones adicionales guardadas del proyecto, </text>

<text x="22" y="438.68747" font-family="Ubuntu,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">Resume el historial mediante el modelo de la ruta nativa y </text>

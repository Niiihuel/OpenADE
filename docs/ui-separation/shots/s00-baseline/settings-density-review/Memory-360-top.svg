<rect x="12" y="211.05356" width="322" height="1" rx="0" fill="#2e2e2e" fill-opacity="1"/>
<text x="22" y="222.05356" font-family="Ubuntu,sans-serif" font-size="12" dominant-baseline="text-before-edge" fill="#d4d4d4" fill-opacity="1" xml:space="preserve">Contexto restante estimado</text>
<text x="22" y="239.87498" font-family="Ubuntu,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">Se calcula con el uso de la última respuesta y el límite </text>
<text x="22" y="252.54463" font-family="Ubuntu,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">verificado del modelo exacto. Después de compactar, </text>
<text x="22" y="265.21426" font-family="Ubuntu,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">espera una nueva respuesta para actualizarse.</text>
<text x="22" y="285.8839" font-family="Ubuntu,sans-serif" font-size="12" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">Sin medición</text>

<text x="30" y="7.8839436" font-family="Ubuntu,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">Se calcula con el uso de la última respuesta y el límite verificado del modelo exacto. Después de compactar, </text>

<text x="30" y="273.1161" font-family="Ubuntu,sans-serif" font-size="12" dominant-baseline="text-before-edge" fill="#d4d4d4" fill-opacity="1" xml:space="preserve">Ofrecer herramientas de OpenIDE</text>
<text x="30" y="290.93753" font-family="Ubuntu,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">Claude Code, Codex y otras CLIs iniciadas desde OpenIDE reciben las herramientas activadas abajo. </text>
<text x="30" y="303.60718" font-family="Ubuntu,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">Desactivado, ninguna llamada externa llega a OpenIDE.</text>
<rect x="540" y="284.69644" width="36" height="20" rx="10" fill="#4c4c4c" fill-opacity="1"/>
<rect x="543" y="287.69644" width="14" height="14" rx="7" fill="#ebebeb" fill-opacity="1"/>
<rect x="20" y="326.2768" width="566" height="1" rx="0" fill="#2e2e2e" fill-opacity="1"/>

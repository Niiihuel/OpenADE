<text x="64" y="169.5268" font-family="Ubuntu,sans-serif" font-size="13" dominant-baseline="text-before-edge" fill="#888888" fill-opacity="1" xml:space="preserve">Funciona con Claude Code y Codex iniciados desde el menú de perfiles de la terminal. </text>
<text x="64" y="184.50002" font-family="Ubuntu,sans-serif" font-size="13" dominant-baseline="text-before-edge" fill="#888888" fill-opacity="1" xml:space="preserve">Navegador y subagentes todavía no se ofrecen: sus interruptores se guardan para </text>
<text x="64" y="199.47322" font-family="Ubuntu,sans-serif" font-size="13" dominant-baseline="text-before-edge" fill="#888888" fill-opacity="1" xml:space="preserve">cuando estén disponibles.</text>
</g>
<text x="24" y="242.44644" font-family="Ubuntu,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">Puente de herramientas</text>
<rect x="20" y="263.1161" width="566" height="128.32143" rx="8" fill="#2b2b2b" fill-opacity="1"/>
<rect x="20.5" y="263.6161" width="565" height="127.32143" rx="7.5" fill="none" stroke="#2e2e2e" stroke-opacity="1" stroke-width="1"/>

<text x="30" y="474.7768" font-family="Ubuntu,sans-serif" font-size="12" dominant-baseline="text-before-edge" fill="#d4d4d4" fill-opacity="1" xml:space="preserve">Revisión de cambios</text>
<text x="30" y="492.59824" font-family="Ubuntu,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">Lee los cambios sin confirmar del proyecto como los muestra la revisión. Solo lectura; no pide </text>
<text x="30" y="505.26788" font-family="Ubuntu,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">aprobación.</text>
<rect x="540" y="486.35715" width="36" height="20" rx="10" fill="#ebebeb" fill-opacity="1"/>
<rect x="559" y="489.35715" width="14" height="14" rx="7" fill="#373737" fill-opacity="1"/>
<rect x="20" y="527.9375" width="566" height="1" rx="0" fill="#2e2e2e" fill-opacity="1"/>
<text x="30" y="538.9375" font-family="Ubuntu,sans-serif" font-size="12" dominant-baseline="text-before-edge" fill="#d4d4d4" fill-opacity="1" xml:space="preserve">Navegador</text>
<text x="30" y="556.7589" font-family="Ubuntu,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">Todavía no disponible. Controlará el navegador integrado que ves en el panel lateral.</text>
<rect x="540" y="544.18304" width="36" height="20" rx="10" fill="#ebebeb" fill-opacity="1"/>
<rect x="559" y="547.18304" width="14" height="14" rx="7" fill="#373737" fill-opacity="1"/>
<rect x="20" y="579.4286" width="566" height="1" rx="0" fill="#2e2e2e" fill-opacity="1"/>
<text x="30" y="590.4286" font-family="Ubuntu,sans-serif" font-size="12" dominant-baseline="text-before-edge" fill="#d4d4d4" fill-opacity="1" xml:space="preserve">Otras conversaciones</text>
<text x="30" y="608.25" font-family="Ubuntu,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">Lee conversaciones de este proyecto, nunca de otros. Su contenido puede incluir datos sensibles o </text>
<text x="30" y="620.9196" font-family="Ubuntu,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">instrucciones que la CLI tome como propias.</text>
<rect x="540" y="602.009" width="36" height="20" rx="10" fill="#4c4c4c" fill-opacity="1"/>
<rect x="543" y="605.009" width="14" height="14" rx="7" fill="#ebebeb" fill-opacity="1"/>
<rect x="20" y="643.5893" width="566" height="1" rx="0" fill="#2e2e2e" fill-opacity="1"/>
<text x="30" y="654.5893" font-family="Ubuntu,sans-serif" font-size="12" dominant-baseline="text-before-edge" fill="#d4d4d4" fill-opacity="1" xml:space="preserve">Subagentes</text>
<text x="30" y="672.4107" font-family="Ubuntu,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">Todavía no disponible. Creará subagentes de OpenIDE y esperará su resultado.</text>
<rect x="540" y="659.83484" width="36" height="20" rx="10" fill="#4c4c4c" fill-opacity="1"/>
<rect x="543" y="662.83484" width="14" height="14" rx="7" fill="#ebebeb" fill-opacity="1"/>
</g>
<text x="24" y="711.0803" font-family="Ubuntu,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">Permisos</text>

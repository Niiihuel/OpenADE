<text x="30" y="741.74994" font-family="Ubuntu,sans-serif" font-size="12" dominant-baseline="text-before-edge" fill="#d4d4d4" fill-opacity="1" xml:space="preserve">Aprobaciones</text>
<text x="30" y="759.57135" font-family="Ubuntu,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">Seguir a la CLI: si la iniciaste en modo aceptar todo, las herramientas de OpenIDE tampoco preguntan. En </text>
<text x="30" y="772.24097" font-family="Ubuntu,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">cualquier otro modo, OpenIDE pide aprobación.</text>
<rect x="30" y="792.91064" width="200" height="28" rx="4" fill="#373737" fill-opacity="1"/>
<rect x="30.5" y="793.41064" width="199" height="27" rx="3.5" fill="none" stroke="#4e4e4e" stroke-opacity="1" stroke-width="1"/>

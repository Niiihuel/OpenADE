<text x="63" y="749.5178" font-family="Ubuntu,sans-serif" font-size="12" dominant-baseline="text-before-edge" fill="#d4d4d4" fill-opacity="1" xml:space="preserve">Configuración del motor</text>
<text x="63" y="768.33923" font-family="Ubuntu,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">El motor administra el parentesco y los límites de delegación. Settings todavía no permite editar </text>

<text x="63" y="303.3661" font-family="Ubuntu,sans-serif" font-size="12" dominant-baseline="text-before-edge" fill="#d4d4d4" fill-opacity="1" xml:space="preserve">Delegación durante Construir</text>
<text x="63" y="322.18753" font-family="Ubuntu,sans-serif" font-size="11" dominant-baseline="text-before-edge" fill="#a0a0a0" fill-opacity="1" xml:space="preserve">El agente nativo puede crear hijos y enviarles entradas. Cada hijo conserva su conversación, sus </text>

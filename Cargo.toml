[workspace]
resolver = "2"
members = [
    "apps/agents-window",
    "crates/openide-core",
    "crates/openide-debug",
    "crates/openide-harness",
    "crates/openide-cli",
    "crates/openide-ui",
    "crates/openide-preview",
    "crates/openide-remote",
    "crates/openide-bridge",
    "crates/openide-browser",
    "crates/openide-connections",
    "crates/openide-graph",
    "crates/openide-acp",
]
# Builds on Linux alone, as a dependency of agents-window there: a member
# would be built by the workspace's commands on every system.
exclude = ["crates/openide-cef"]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Niiihuel/openADE"

# Keep development builds small while reusing the incremental compilation cache.
[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
debug = false

# The interactive desktop runs optimized, while cargo test/check keep the
# fast development profile. Keep assertions and useful backtrace locations.
[profile.desktop]
inherits = "dev"
opt-level = 2
codegen-units = 16

# limn is pinned to a tag. To build against the local checkout instead
# (while changing limn), uncomment this block.
# [patch."https://github.com/Niiihuel/limn.git"]
# limn = { path = "../lienzo/crates/limn" }
# limn-egui = { path = "../lienzo/crates/limn-egui" }
# limn-editor = { path = "../lienzo/crates/limn-editor" }
# limn-language = { path = "../lienzo/crates/limn-language" }

[package]
name = "agents-window"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
openide-core = { path = "../../crates/openide-core" }
openide-harness = { path = "../../crates/openide-harness" }
openide-cli = { path = "../../crates/openide-cli" }
openide-ui = { path = "../../crates/openide-ui" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
resvg = { version = "0.48.1", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
portable-pty = "0.9.0"
vt100 = "0.16.2"

[dev-dependencies]
tempfile = "3"
unicode-segmentation = "1.12"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Media_Speech", "Win32_System_Com"] }
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

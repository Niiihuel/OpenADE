[package]
name = "agents-window"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
editor-e2e = []

[dependencies]
openide-connections = { path = "../../crates/openide-connections" }
# accesskit: what limn describes of each frame reaches screen readers.
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "links", "x11", "wayland", "accesskit"] }
openide-core = { path = "../../crates/openide-core" }
openide-harness = { path = "../../crates/openide-harness" }
openide-cli = { path = "../../crates/openide-cli" }
openide-bridge = { path = "../../crates/openide-bridge" }
openide-browser = { path = "../../crates/openide-browser" }
openide-ui = { path = "../../crates/openide-ui" }
limn-egui = { git = "https://github.com/Niiihuel/limn.git", rev = "bb10b720e0a20684366319998d2fd2a7e7b67c3e" }
openide-preview = { path = "../../crates/openide-preview" }
openide-debug = { path = "../../crates/openide-debug" }
openide-graph = { path = "../../crates/openide-graph" }
openide-acp = { path = "../../crates/openide-acp" }
openide-editor = { package = "limn-editor", git = "https://github.com/Niiihuel/limn.git", rev = "bb10b720e0a20684366319998d2fd2a7e7b67c3e" }
openide-language = { package = "limn-language", git = "https://github.com/Niiihuel/limn.git", rev = "bb10b720e0a20684366319998d2fd2a7e7b67c3e" }
serde_json = "1"
serde_yaml = "0.9"
color = "0.3"
notify-rust = "4.18.2"
notify = "8"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
semver = "1"
minisign-verify = "0.2"
flate2 = "1"
tar = "0.4"
sha1 = "0.10"
jsonwebtoken = { version = "9.3", default-features = false }
fs2 = "0.4"
fontdb = "0.24"
ignore = "0.4"
resvg = { version = "0.48.1", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
arboard = { version = "3.6.1", default-features = false, features = ["image-data", "wayland-data-control"] }
portable-pty = "0.9.0"
vt100 = "0.16.2"
unicode-segmentation = "1.12"
trash = "5"
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }

[dev-dependencies]
tempfile = "3"
minisign = "0.7"
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts", "raster-images"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Media_Speech", "Win32_System_Com"] }
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Dictation off Windows: the microphone, and whisper.cpp to transcribe it.
[target.'cfg(not(windows))'.dependencies]
cpal = "0.17"
whisper-rs = "0.16"

[target.'cfg(target_os = "linux")'.dependencies]
# Files dropped from other applications on Wayland, which winit does not receive.
limn-dnd = { git = "https://github.com/Niiihuel/limn.git", rev = "bb10b720e0a20684366319998d2fd2a7e7b67c3e" }
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "file_chooser", "settings"] }
# The project browser: Chromium embedded through CEF, which `shell.nix` provides.
openide-cef = { path = "../../crates/openide-cef" }
